    <link rel="icon" type="image/png" href="/src/assets/logo-light.png" />
    <title>The Curated Archive — Scholarly Research Repository</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="The Curated Archive is an open-access, independent academic repository indexing peer-reviewed scientific papers and scholarly research articles from Zambia's top universities." />
    <meta name="keywords" content="Zambian research archive, academic repository, open-access papers, UNZA, CBU, peer-reviewed journals, citation logging, scientific publications, scholarly archive" />
    <meta name="author" content="The Curated Archive Editorial Board" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.curatedarchive.tech/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.curatedarchive.tech/" />
    <meta property="og:title" content="The Curated Archive — Scholarly Research Repository" />
    <meta property="og:description" content="An open-access academic repository indexing peer-reviewed research papers and scientific publications from Zambian universities and independent labs." />
    <meta property="og:image" content="/src/assets/logo-light.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://www.curatedarchive.tech/" />
    <meta property="twitter:title" content="The Curated Archive — Scholarly Research Repository" />
    <meta property="twitter:description" content="An open-access academic repository indexing peer-reviewed research papers and scientific publications from Zambian universities and independent labs." />
    <meta property="twitter:image" content="/src/assets/logo-light.png" />

    <!-- Structured Data JSON-LD for Google Scholar/Academic Archive -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "The Curated Archive",
        "description": "An open-access academic repository indexing un-peer-reviewed research papers and scientific publications from Zambian universities and independent labs.",
        "url": "https://www.curatedarchive.tech/",
        "logo": "https://www.curatedarchive.tech/src/assets/logo-light.png",
        "knowsAbout": [
          "Un-Peer review",
          "Academic publishing",
          "Scientific research",
          "Open science",
          "Zambian universities"
        ]
      }
    </script>
  </head>
